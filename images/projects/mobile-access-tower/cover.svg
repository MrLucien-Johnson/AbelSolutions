<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-label="Mobile access tower construction cover">
  <defs>
    <linearGradient id="sky" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#7EB6D9"/>
      <stop offset="55%" stop-color="#4A90C2"/>
      <stop offset="100%" stop-color="#2F6FA0"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8EEF2"/>
      <stop offset="100%" stop-color="#A8B4BC"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#sky)"/>
  <ellipse cx="220" cy="140" rx="120" ry="40" fill="#ffffff" opacity="0.35"/>
  <ellipse cx="980" cy="180" rx="160" ry="50" fill="#ffffff" opacity="0.28"/>
  <!-- tower uprights -->
  <rect x="430" y="80" width="18" height="620" fill="url(#metal)"/>
  <rect x="752" y="80" width="18" height="620" fill="url(#metal)"/>
  <!-- platforms -->
  <rect x="400" y="220" width="400" height="28" rx="4" fill="#2A343A"/>
  <rect x="400" y="400" width="400" height="28" rx="4" fill="#2A343A"/>
  <rect x="400" y="560" width="400" height="28" rx="4" fill="#2A343A"/>
  <!-- hatch -->
  <rect x="560" y="404" width="80" height="20" rx="2" fill="#5B6A72"/>
  <!-- braces -->
  <line x1="448" y1="248" x2="752" y2="400" stroke="#C5CED4" stroke-width="10"/>
  <line x1="752" y1="248" x2="448" y2="400" stroke="#C5CED4" stroke-width="10"/>
  <line x1="448" y1="428" x2="752" y2="560" stroke="#C5CED4" stroke-width="10"/>
  <line x1="752" y1="428" x2="448" y2="560" stroke="#C5CED4" stroke-width="10"/>
  <!-- rungs -->
  <g stroke="#D7DEE3" stroke-width="6">
    <line x1="448" y1="280" x2="752" y2="280"/>
    <line x1="448" y1="320" x2="752" y2="320"/>
    <line x1="448" y1="360" x2="752" y2="360"/>
    <line x1="448" y1="460" x2="752" y2="460"/>
    <line x1="448" y1="500" x2="752" y2="500"/>
    <line x1="448" y1="540" x2="752" y2="540"/>
  </g>
  <!-- worker cue -->
  <circle cx="980" cy="620" r="34" fill="#F2F5F7"/>
  <rect x="940" y="655" width="80" height="70" rx="10" fill="#C9A227"/>
  <rect x="930" y="655" width="100" height="18" fill="#E8D56A"/>
  <text x="80" y="680" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#0B1C2C">Mobile access tower work</text>
  <text x="80" y="715" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#0B1C2C" opacity="0.75">Site photography preparing for publication</text>
</svg>
