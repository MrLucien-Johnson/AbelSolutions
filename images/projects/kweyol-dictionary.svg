<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-label="Kwéyòl Dictionary project cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1C2C"/>
      <stop offset="50%" stop-color="#123048"/>
      <stop offset="100%" stop-color="#1A4034"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <circle cx="1040" cy="120" r="180" fill="#1F6FAD" opacity="0.18"/>
  <circle cx="160" cy="640" r="160" fill="#C4A574" opacity="0.14"/>
  <rect x="90" y="110" width="1020" height="530" rx="24" fill="url(#card)" stroke="#ffffff22"/>
  <rect x="140" y="180" width="420" height="300" rx="18" fill="#0F2436" stroke="#ffffff18"/>
  <text x="170" y="240" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#9EC9EA">Kwéyòl</text>
  <text x="170" y="300" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#FFFFFF">bonjou</text>
  <text x="170" y="350" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#FFFFFF99">hello / good morning</text>
  <rect x="170" y="390" width="180" height="36" rx="8" fill="#1F6FAD" opacity="0.85"/>
  <text x="260" y="415" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">Listen · Learn</text>
  <rect x="620" y="180" width="420" height="300" rx="18" fill="#102A22" stroke="#ffffff18"/>
  <text x="830" y="260" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">Dominican Kwéyòl</text>
  <text x="830" y="310" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#C4E0D4">English dictionary</text>
  <text x="830" y="370" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#FFFFFF99">Learn · Preserve · Celebrate</text>
  <text x="830" y="430" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#9EC9EA">300+ provisional entries</text>
  <text x="600" y="690" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" fill="#FFFFFF">Kwéyòl Dictionary</text>
